<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #e94560;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
      border: 2px solid #0f3460;
    }

    .score-box .label {
      font-size: 0.8rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-box .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-box.x .value { color: #e94560; }
    .score-box.draws .value { color: #f5a623; }
    .score-box.o .value { color: #4ecdc4; }

    .status {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      color: #ccc;
      transition: color 0.3s;
    }

    .status.x-turn { color: #e94560; }
    .status.o-turn { color: #4ecdc4; }
    .status.winner { color: #f5a623; font-weight: bold; font-size: 1.3rem; }
    .status.draw { color: #aaa; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.04);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #e94560; }
    .cell.o { color: #4ecdc4; }

    .cell.win-cell {
      background: #0f3460;
      border-color: #f5a623;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.6rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }
    button:active { transform: scale(0.97); }

    #btn-restart {
      background: #e94560;
      color: #fff;
    }

    #btn-reset-score {
      background: #0f3460;
      color: #ccc;
      border: 1px solid #e94560;
    }

    .mode-selector {
      margin-bottom: 1.2rem;
      display: flex;
      gap: 0.8rem;
    }

    .mode-btn {
      padding: 0.4rem 1.1rem;
      border: 2px solid #0f3460;
      border-radius: 20px;
      background: #16213e;
      color: #aaa;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      border-color: #e94560;
      color: #e94560;
      background: #0f3460;
    }
  </style>
</head>
<body>
  <h1>Jogo da Velha</h1>

  <div class="mode-selector">
    <button class="mode-btn active" id="mode-pvp">2 Jogadores</button>
    <button class="mode-btn" id="mode-ai">vs Computador</button>
  </div>

  <div class="scoreboard">
    <div class="score-box x">
      <div class="label" id="label-x">Jogador X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box draws">
      <div class="label">Empates</div>
      <div class="value" id="score-draws">0</div>
    </div>
    <div class="score-box o">
      <div class="label" id="label-o">Jogador O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div class="status" id="status">Vez do Jogador X</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="buttons">
    <button id="btn-restart">Nova Partida</button>
    <button id="btn-reset-score">Zerar Placar</button>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;
    let vsAI = false;
    let scores = { X: 0, O: 0, draws: 0 };

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreDraws = document.getElementById('score-draws');
    const labelO = document.getElementById('label-o');

    document.getElementById('mode-pvp').addEventListener('click', () => setMode(false));
    document.getElementById('mode-ai').addEventListener('click', () => setMode(true));
    document.getElementById('btn-restart').addEventListener('click', resetGame);
    document.getElementById('btn-reset-score').addEventListener('click', resetScore);

    cells.forEach(cell => {
      cell.addEventListener('click', () => handleClick(parseInt(cell.dataset.index)));
    });

    function setMode(ai) {
      vsAI = ai;
      document.getElementById('mode-pvp').classList.toggle('active', !ai);
      document.getElementById('mode-ai').classList.toggle('active', ai);
      labelO.textContent = ai ? 'Computador' : 'Jogador O';
      resetGame();
    }

    function handleClick(index) {
      if (gameOver || board[index]) return;
      if (vsAI && currentPlayer === 'O') return;
      makeMove(index);
      if (vsAI && !gameOver && currentPlayer === 'O') {
        setTimeout(aiMove, 400);
      }
    }

    function makeMove(index) {
      board[index] = currentPlayer;
      const cell = cells[index];
      cell.textContent = currentPlayer;
      cell.classList.add('taken', currentPlayer.toLowerCase());

      const winLine = checkWin();
      if (winLine) {
        winLine.forEach(i => cells[i].classList.add('win-cell'));
        const winner = currentPlayer === 'X' ? 'Jogador X' : (vsAI ? 'Computador' : 'Jogador O');
        setStatus(`${winner} venceu!`, 'winner');
        scores[currentPlayer]++;
        updateScore();
        gameOver = true;
        return;
      }
      if (board.every(v => v)) {
        setStatus('Empate!', 'draw');
        scores.draws++;
        updateScore();
        gameOver = true;
        return;
      }
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      const nextLabel = currentPlayer === 'X' ? 'Jogador X' : (vsAI ? 'Computador' : 'Jogador O');
      setStatus(`Vez d${currentPlayer === 'X' ? 'o Jogador X' : (vsAI ? 'o Computador' : 'o Jogador O')}`,
        currentPlayer === 'X' ? 'x-turn' : 'o-turn');
    }

    function checkWin() {
      return WINS.find(line => {
        const [a,b,c] = line;
        return board[a] && board[a] === board[b] && board[a] === board[c];
      }) || null;
    }

    function aiMove() {
      const move = getBestMove();
      makeMove(move);
    }

    function getBestMove() {
      // Try to win
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkWin()) { board[i] = null; return i; }
          board[i] = null;
        }
      }
      // Block X
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'X';
          if (checkWin()) { board[i] = null; return i; }
          board[i] = null;
        }
      }
      // Center
      if (!board[4]) return 4;
      // Corners
      const corners = [0,2,6,8].filter(i => !board[i]);
      if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
      // Any empty
      const empties = board.map((v,i) => v ? null : i).filter(v => v !== null);
      return empties[Math.floor(Math.random() * empties.length)];
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (cls || '');
    }

    function updateScore() {
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      scoreDraws.textContent = scores.draws;
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
      setStatus('Vez do Jogador X', 'x-turn');
    }

    function resetScore() {
      scores = { X: 0, O: 0, draws: 0 };
      updateScore();
      resetGame();
    }

    // Init
    setStatus('Vez do Jogador X', 'x-turn');
  </script>
</body>
</html>
